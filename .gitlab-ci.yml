image: rust:bookworm

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
  DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
  DOCKER_IMAGE_LATEST: ${CI_REGISTRY_IMAGE}:latest

cache:
  key: ${CI_JOB_NAME}
  paths:
    - .cargo/
    - target/

stages:
  - lint
  - build
  - test
  - docker
  - scan

before_script:
  - apt-get update && apt-get install -y --no-install-recommends
    build-essential pkg-config libssl-dev perl
    && rm -rf /var/lib/apt/lists/*

# ── Lint ───────────────────────────────────────────────────────
rustfmt:
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings

# ── Build ──────────────────────────────────────────────────────
build-cli:
  stage: build
  script:
    - cargo build --release --bin port_sniffer
  artifacts:
    paths:
      - target/release/port_sniffer
    expire_in: 1 week

build-gui:
  stage: build
  script:
    - apt-get install -y --no-install-recommends
      libgtk-3-dev libxcb1-dev libxkbcommon-dev libfontconfig1-dev
    - cargo build --release --bin akroatis
  artifacts:
    paths:
      - target/release/akroatis
    expire_in: 1 week

# ── Test ────────────────────────────────────────────────────────
test:
  stage: test
  script:
    - cargo test --all-targets

# ── Docker ──────────────────────────────────────────────────────
docker:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache docker-cli
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
  only:
    - main

# ── Smoke test ──────────────────────────────────────────────────
smoke-test:
  stage: scan
  needs: ["docker"]
  image: $DOCKER_IMAGE_LATEST
  script:
    - port_sniffer --help
    - port_sniffer 127.0.0.1 --port-range 22,80,443
  only:
    - main

# ── Weekly CVE sync (scheduled) ────────────────────────────────
weekly-cve-update:
  stage: scan
  image: $DOCKER_IMAGE_LATEST
  script:
    - port_sniffer update-db --download-cves --since $(date -d '7 days ago' '+%Y-%m-%d')
  only:
    - schedules
