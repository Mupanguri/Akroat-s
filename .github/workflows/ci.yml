name: Akroatis CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Rust Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build target
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt -- --check

      - name: Run clippy linter
        run: cargo clippy -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

  security-scan:
    name: Supply Chain & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit (RustSec Advisory DB)
        run: cargo audit

      - name: Run Syft SBOM Generator & Grype SCA Scan
        uses: anchore/scan-action@v3
        with:
          path: "."
          fail-build: false