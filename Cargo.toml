[package]
name = "port_sniffer"
version = "0.1.0"
edition = "2021"

[lib]
name = "port_sniffer"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"
ring = "0.17"
colored = "3.0.0"
eframe = "0.33.3"
egui = "0.33.3"
image = "0.25"
indicatif = "0.18.3"
rand = "0.9.2"
regex = "1.12.2"
# Enhanced service detection - using only crates known to work well on Windows
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
governor = "0.6"
futures = "0.3"
ipnetwork = "0.20.0"
base64 = "0.22"
printpdf = "0.7"
webbrowser = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
tokio-rustls = "0.26"
x509-parser = "0.17"
toml = "0.8"
dirs = "6.0"
rusqlite = { version = "0.31", features = ["bundled"] }
lasso = "0.7"
quick-xml = "0.36"
